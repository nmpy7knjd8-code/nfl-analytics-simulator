name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev,phase2,models]"
      - name: Pytest (unit; integration tests need the ingested lake / network)
        run: python -m pytest -q -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build static Pages export
        run: npm run build:pages

  acceptance:
    # C7 acceptance tests (redesign brief): schedule truth vs nflverse, FG <= 64 yd,
    # 0:00-15:00 clocks, NFL team codes, no developer text in the built site, redirects.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build site
        working-directory: frontend
        run: npm run build:pages && python3 ../scripts/pages/assemble.py
      - name: Dump shown data
        working-directory: frontend
        run: node --import tsx ../scripts/acceptance/dump_site_data.ts > ../site-data.json
      - name: Acceptance checks
        run: python3 scripts/acceptance/check.py site-data.json _site
      - name: House-rule checks (creative-builds.md, existing features)
        if: always()
        run: python3 scripts/acceptance/house_rules.py site-data.json _site
