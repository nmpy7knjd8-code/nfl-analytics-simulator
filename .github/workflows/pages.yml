name: Pages

# Builds the Pages site from source: a fresh frontend static export (build:pages)
# at the site root, plus static files from docs/ and redirects from old /demo/ paths
# (scripts/pages/assemble.py).
# The build job runs on every PR and push. The deploy job only runs on main
# once the repo variable PAGES_VIA_ACTIONS is "true" (set it after switching
# Settings > Pages > Source to "GitHub Actions"), so it can't fail or race
# the current branch-based deploy before the switch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Game files from release asset (only when repo variable GAMES_RELEASE_TAG is set)
        env:
          GAMES_RELEASE_TAG: ${{ vars.GAMES_RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/pages/game_files_release.sh fetch
      - name: Prebuild share cards (1200x675 OG / X images)
        working-directory: frontend
        run: |
          python3 -m pip install --quiet pillow
          node --import tsx ../scripts/og/cards_data.ts > ../cards.json
          python3 ../scripts/og/make_cards.py ../cards.json
      - name: Build static export
        working-directory: frontend
        run: npm run build:pages
      - name: Assemble site (app at root + redirects from old /demo/ paths)
        run: python3 scripts/pages/assemble.py
      - name: Verify site
        run: |
          for f in index.html daily/index.html fourth-down/index.html games/index.html 404.html favicon.svg \
                   demo/index.html demo/quiz/index.html demo/decide/index.html demo/games/index.html \
                   quiz/index.html decide/index.html; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
            echo "ok $f"
          done
          grep -q '/nfl-analytics-simulator/_next/' _site/index.html
          grep -q 'url=/nfl-analytics-simulator/daily/' _site/quiz/index.html
          grep -q 'url=/nfl-analytics-simulator/"' _site/demo/index.html
          for f in og/home.png og/daily.png og/fourth-down.png og/games.png; do test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }; done
          grep -q 'name="twitter:card" content="summary_large_image"' _site/index.html
          grep -q 'property="og:image" content="https://nmpy7knjd8-code.github.io/nfl-analytics-simulator/og/daily.png"' _site/daily/index.html
          # Game pages come from the Next export (frontend/out), i.e. generateStaticParams over the
          # game list; redirect stubs for renamed ids (assemble.py GAME_ID_MOVES) are not game pages.
          n=0; for g in frontend/out/games/*/index.html; do id=$(basename "$(dirname "$g")"); n=$((n+1)); test -s "_site/og/games/$id.png" || { echo "missing card for $id"; exit 1; }; grep -q "og/games/$id.png" "_site/games/$id/index.html" || { echo "no og:image on games/$id"; exit 1; }; echo "ok card games/$id"; done; test "$n" -gt 0 || { echo "no game pages built"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
