name: Pages

# Builds the Pages site from source: the frontend static export (build:pages)
# is the whole site, served at the root; old /demo/ links redirect.
# The build job runs on every PR and push. The deploy job only runs on main
# once the repo variable PAGES_VIA_ACTIONS is "true" (set it after switching
# Settings > Pages > Source to "GitHub Actions"), so it can't fail or race
# the current branch-based deploy before the switch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build static export
        working-directory: frontend
        run: npm run build:pages
      - name: Assemble site
        # The app is the whole site (served at /<repo>/). build:pages also writes
        # redirect pages for the old /demo/, /quiz/ and /decide/ links.
        run: |
          rm -rf _site
          cp -a frontend/out _site
          touch _site/.nojekyll
      - name: Verify routes and redirects
        run: |
          for f in index.html daily/index.html daily/stats/index.html practice/index.html about/index.html games/index.html fourth-down/index.html 404.html icon.svg; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
            echo "ok $f"
          done
          grep -q '/nfl-analytics-simulator/_next/' _site/index.html
          grep -q 'url=/nfl-analytics-simulator/"' _site/demo/index.html
          grep -q 'url=/nfl-analytics-simulator/practice/' _site/demo/quiz/index.html
          grep -q 'url=/nfl-analytics-simulator/practice/' _site/quiz/index.html
          grep -q 'url=/nfl-analytics-simulator/fourth-down/' _site/decide/index.html
          grep -q 'demo/' _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
