[project]
name = "nfl-sim"
version = "0.2.0"
description = "NFL Analytics Simulator — Phase 2 historical ingest + API"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]
phase2 = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "numpy>=2.1.0",
  "nflreadpy==0.1.5",
  "httpx>=0.27.0",
  "requests>=2.32.0",
]
models = [
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "pandas>=2.2.0",
  "numpy>=2.1.0",
  "pyarrow>=18.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_sim"]

# Ship Situation Lab HTML + pre-snap fixtures + quiz pack with the package (not fan UI).
[tool.hatch.build.targets.wheel.force-include]
"src/nfl_sim/api/static" = "nfl_sim/api/static"
"src/nfl_sim/providers/fixtures" = "nfl_sim/providers/fixtures"
"src/nfl_sim/quiz/data" = "nfl_sim/quiz/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that require ingested 2023 lake or network download",
]
